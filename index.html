<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ECE7A0">
<title>SHIKAND?</title>
<style>
:root{--bg:#ECE7A0;--paper:#F0CAA1;--ink:#554345;--muted:#735766;--faint:#8D6A76;--line:rgba(85,67,69,.18);--accent:#D463A1;--accent2:#7FB9B9;--sage:#7FB9B9;--gold:#F0CAA1;--sky:#6CAEDE;--danger:#b74f79;--shadow:0 14px 44px rgba(85,67,69,.13);--shadow-hi:0 24px 64px rgba(85,67,69,.21);--r-sm:12px;--r:22px;--r-lg:34px;--serif:Georgia,'Times New Roman',serif;--sans:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}body{background-image:radial-gradient(circle at 82% 0,rgba(108,174,222,.34),transparent 30%),radial-gradient(circle at 0 100%,rgba(127,185,185,.35),transparent 34%),linear-gradient(135deg,rgba(236,231,160,.72),rgba(240,202,161,.42))}button,input,textarea{font:inherit}button{cursor:pointer}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:28px 18px;border-right:1px solid var(--line);background:rgba(240,202,161,.76);backdrop-filter:blur(18px);z-index:10;overflow-y:auto}
.brand{font:italic 700 26px/1 var(--serif);letter-spacing:-1px;margin:4px 10px 26px}.brand b{color:var(--accent)}
.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:var(--muted);padding:11px 13px;border-radius:14px;text-align:left;display:flex;align-items:center;gap:10px;transition:transform .2s var(--ease),background .2s,color .2s;font-size:14px}
.nav button:hover{transform:translateX(3px);background:#fff}.nav button.active{background:var(--ink);color:#fff;box-shadow:var(--shadow)}
.nav i{font-style:normal;width:22px;text-align:center}
.side-foot{margin-top:28px;padding:0 10px;color:var(--faint);font-size:11px;line-height:1.5}
.main{min-width:0}
.top{height:70px;display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:0 32px;position:sticky;top:0;z-index:8;background:linear-gradient(var(--bg),rgba(236,231,160,.88));backdrop-filter:blur(12px)}
.iconbtn,.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:10px 15px;box-shadow:0 5px 16px rgba(55,38,30,.06);transition:transform .25s var(--ease),box-shadow .25s,background .2s}
.iconbtn:active,.btn:active{transform:scale(.92)}.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.content{max-width:1180px;margin:auto;padding:18px 32px 110px}
.page{animation:page .45s var(--ease) both}@keyframes page{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.eyebrow{text-transform:uppercase;letter-spacing:.16em;color:var(--accent);font-size:11px;font-weight:800}
.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:10px 0 26px}
.head h1{font:600 clamp(36px,5.5vw,68px)/.95 var(--serif);letter-spacing:-3px;margin:0}
.head h1 em{color:var(--accent);font-weight:400}
.head p{color:var(--muted);max-width:380px;line-height:1.55;margin:0;font-size:14.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.grid2{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;align-items:start}
.stack{display:grid;gap:16px}

.auth-gate{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;
  background:radial-gradient(ellipse at 30% 20%,rgba(212,99,161,.18),transparent 50%),radial-gradient(ellipse at 70% 80%,rgba(108,174,222,.15),transparent 45%),var(--bg)}
.auth-gate.hidden{display:none!important}
.auth-card{width:min(400px,100%);background:var(--paper);border-radius:24px;padding:28px 24px;box-shadow:var(--shadow);border:1px solid rgba(232,223,216,.9)}
.auth-card h1{font:600 28px/1.1 var(--serif);margin:0 0 8px;letter-spacing:-1px}
.auth-card .sub{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 20px}
.auth-card .field{margin-bottom:12px}
.auth-err{color:#c4457a;font-size:13px;margin:8px 0 0;min-height:1.2em}
.auth-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.auth-actions .btn{flex:1;min-width:120px}
.dash-min .head{margin:0 0 18px!important}
.dash-min .head h1{font:600 clamp(32px,5vw,56px)/.95 var(--serif)!important;letter-spacing:-2.5px}
.dash-min .head p{color:var(--ink)!important;opacity:.78;max-width:380px;line-height:1.55;margin:10px 0 0;font-size:14.5px}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;min-height:min(58vh,520px);align-items:stretch}
.dash-cell{display:flex;flex-direction:column;min-height:0;height:100%;margin:0!important;border-radius:var(--r)!important}
.dash-cell.hero,.card.hero.dash-cell{overflow:visible!important}
.dash-cell .field{flex:1;display:flex;flex-direction:column;margin:0}
.dash-cell textarea{flex:1;min-height:0!important;resize:none}
.dash-min .card:hover{transform:none;box-shadow:var(--shadow)}
.dash-cell .lily-side{width:min(140px,42%);right:-8px;bottom:-6px;opacity:.95}
.dash-cell .check{display:flex;align-items:center;gap:8px}
.dash-cell .check .row-del{margin-left:auto;opacity:.45;background:none;border:0;cursor:pointer;font-size:14px}
.dash-cell .check .row-del:hover{opacity:1}
.save-pill{position:fixed;bottom:18px;right:18px;z-index:50;background:var(--paper);border:1px solid rgba(232,223,216,.9);border-radius:999px;padding:8px 14px;font-size:12px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s}
.save-pill.show{opacity:1}
@media(max-width:700px){.dash-grid{grid-template-columns:1fr;grid-template-rows:auto;min-height:0;gap:12px}.dash-cell .lily-side{width:100px}}

.card{background:var(--paper);border:1px solid rgba(232,223,216,.9);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .3s var(--ease),box-shadow .3s}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hi)}
.card.hero{background:linear-gradient(145deg,#392c28,#7e4c45);color:#fff;border-radius:var(--r-lg);min-height:240px}
.card.tint{background:#7FB9B9}.card.rose{background:#D463A1;color:#554345}.card.sky{background:#6CAEDE}.card.lilac{background:#c9a0c4}.card.peach{background:#f0b8a0}
.label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--faint);margin-bottom:10px}
.hero .label{color:#e8c8bb}
.card h2{font-family:var(--serif);font-size:28px;line-height:1.08;margin:0 0 12px}
.card h3{font-family:var(--serif);font-size:20px;margin:0 0 10px}
.field{margin:10px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}
.field input,.field textarea{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.7);padding:10px 12px;border-radius:var(--r-sm);outline:0;color:var(--ink)}
.field textarea{min-height:88px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(127,185,185,.25)}
.check{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.check:last-child{border:0}
.check .row-del{margin-left:auto;border:0;background:transparent;color:var(--faint);opacity:.5;cursor:pointer;font-size:12px;padding:4px}
.check .row-del:hover{opacity:1;color:var(--accent)}
.muted-note{font-size:12.5px;color:var(--muted)}
.wish-photo{width:100%;height:150px;object-fit:cover;border-radius:14px;margin-bottom:10px;display:block;background:rgba(0,0,0,.05)}
.wish-link{display:inline-block;text-decoration:none;margin-bottom:10px}
.check input{display:none}
.box{width:20px;height:20px;border-radius:7px;border:1.5px solid var(--accent2);position:relative;flex:none;transition:transform .25s,background .2s}
.check input:checked+.box{background:var(--accent);transform:rotate(8deg) scale(1.06)}
.check input:checked+.box:after{content:'✓';position:absolute;color:#fff;font-weight:900;font-size:12px;left:4px;top:0}
.check input:checked~span{text-decoration:line-through;color:var(--faint)}
.progress{height:8px;background:#eee6e0;border-radius:20px;overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#D463A1,#f7e4ec 70%,#fff);border-radius:inherit}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:12px;background:rgba(255,255,255,.55);border-radius:14px;text-align:center}
.stat b{display:block;font:600 22px var(--serif)}.stat small{color:var(--muted);font-size:11px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.55);border-radius:999px;padding:7px 11px;font-size:12px;cursor:pointer}
.chip:hover{background:#fff}
.task-form{display:flex;gap:8px;margin-top:8px}
.task-form input{flex:1;border:1px solid var(--line);border-radius:999px;padding:9px 13px}
.task-form button{border:0;border-radius:50%;width:38px;height:38px;background:var(--ink);color:#fff;font-size:18px}
.empty{color:var(--faint);font:italic 14px var(--serif);padding:6px 0}
.money-jar{display:grid;place-items:center;gap:12px;text-align:center}
.jar{width:110px;height:136px;border:4px solid var(--ink);border-top-width:8px;border-radius:18px 18px 34px 34px;position:relative;overflow:hidden;background:rgba(255,255,255,.25)}
.jar:before{content:'';position:absolute;inset:auto 0 0;height:var(--fill);background:linear-gradient(180deg,var(--sky),var(--accent2))}
.jar:after{content:'✦';position:absolute;inset:0;display:grid;place-items:center;font-size:26px;color:var(--ink)}
.money-number{font:600 26px var(--serif)}
/* big shimmering jar for the Money page */
.jar-wrap{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.jar-lg{flex:0 0 auto;width:150px;height:190px;border:5px solid var(--ink);border-top-width:9px;border-radius:24px 24px 42px 42px;position:relative;overflow:hidden;background:rgba(255,255,255,.25);margin:0 auto}
.jar-lg .water{position:absolute;left:0;right:0;bottom:0;height:var(--fill);background:linear-gradient(180deg,var(--sky),var(--accent2));overflow:hidden;transition:height .4s var(--ease)}
.jar-lg .water:before{content:'';position:absolute;left:-30%;right:-30%;top:-10px;height:20px;background:radial-gradient(ellipse at center,rgba(255,255,255,.9) 0 42%,transparent 46%);background-size:34px 20px;background-repeat:repeat-x;animation:jarWave 2.6s linear infinite}
.jar-lg .water:after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.6) 48%,transparent 66%);background-size:220% 220%;animation:jarShimmer 3.4s ease-in-out infinite}
.jar-lg .sparkle{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;color:var(--ink);opacity:.85;z-index:1}
@keyframes jarWave{0%{transform:translateX(0)}100%{transform:translateX(-34px)}}
@keyframes jarShimmer{0%,100%{background-position:0% 0%}50%{background-position:100% 100%}}
.jar-info{flex:1;min-width:190px}
html.dark .jar-lg{border-color:var(--ink);background:rgba(255,255,255,.06)}
html.dark .jar-lg .sparkle{color:var(--ink)}
/* pretty piggy-bank jar v2 */
.jar-shape{position:relative;width:132px;height:180px;margin:0 auto 4px;filter:drop-shadow(0 14px 22px rgba(85,67,69,.22))}
.jar-shape .lid-top{position:absolute;top:-6px;left:34px;width:64px;height:9px;background:linear-gradient(180deg,#8a675c,#4a3733);border-radius:5px;z-index:3}
.jar-shape .lid{position:absolute;top:1px;left:28px;width:76px;height:17px;background:linear-gradient(180deg,#725850,#453230);border-radius:7px 7px 3px 3px;z-index:2;box-shadow:0 3px 5px rgba(0,0,0,.18)}
.jar-shape .lid:before{content:'';position:absolute;left:6px;right:6px;top:3px;height:2px;background:rgba(255,255,255,.25);border-radius:2px}
.jar-shape .body{position:absolute;top:17px;left:0;right:0;bottom:0;border:3px solid var(--ink);border-radius:16px 16px 46px 46px/16px 16px 52px 52px;background:rgba(255,255,255,.3);overflow:hidden}
.jar-shape .glass-shine{position:absolute;top:8%;left:15px;width:11px;height:58%;background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0));border-radius:8px;filter:blur(.4px);z-index:2;pointer-events:none}
.jar-shape .water{position:absolute;left:0;right:0;bottom:0;height:var(--fill);background:linear-gradient(180deg,var(--sky),var(--accent2) 88%);transition:height .5s var(--ease)}
.jar-shape .water:before{content:'';position:absolute;left:-30%;right:-30%;top:-7px;height:15px;background:radial-gradient(ellipse at center,rgba(255,255,255,.9) 0 42%,transparent 46%);background-size:28px 15px;background-repeat:repeat-x;animation:jarWave 2.6s linear infinite}
.jar-shape .water:after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.5) 48%,transparent 66%);background-size:220% 220%;animation:jarShimmer 3.4s ease-in-out infinite}
.jar-shape .coin{position:absolute;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#fff6d8,#e8c15a 58%,#b98a2e);box-shadow:0 1px 2px rgba(0,0,0,.25);z-index:2}
.jar-shape .coin.c1{left:22%;bottom:12%}
.jar-shape .coin.c2{left:50%;bottom:20%}
.jar-shape .coin.c3{left:66%;bottom:9%}
html.dark .jar-shape .body{border-color:var(--ink);background:rgba(255,255,255,.06)}
.jar-money-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;justify-content:center}
.jar-money-top .amt{font:700 30px var(--serif);color:var(--ink)}
.jar-money-top .of{font-size:12.5px;color:var(--muted)}
.jar-progress{height:9px;background:#eee6e0;border-radius:20px;overflow:hidden;margin:10px 0 14px}
.jar-progress i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--accent2));border-radius:inherit;transition:width .4s var(--ease)}
.jar-edit summary{cursor:pointer;color:var(--muted);font-size:12.5px;margin-top:6px}
/* balance card */
.balance-hero{text-align:center;margin-bottom:14px}
.balance-amount{font:700 32px var(--serif);color:var(--ink)}
.balance-amount.neg{color:#b8455f}
.bal-rows{display:grid;gap:5px}
.bal-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:8px}
.bal-bar{height:8px;border-radius:6px;background:rgba(0,0,0,.08);overflow:hidden}
.bal-fill{height:100%;border-radius:6px;transition:width .4s var(--ease)}
.bal-fill.inc{background:var(--accent2)}
.bal-fill.exp{background:var(--accent)}
html.dark .bal-bar{background:rgba(255,255,255,.1)}
.timeline{display:grid;gap:8px}
.timeline>div{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center}
.timeline time{color:var(--accent);font-weight:800;font-size:12px}
.timeline span{padding:10px 12px;background:#f5efea;border-radius:12px;font-size:13.5px}
.dp-time{border:1px solid var(--line);background:rgba(255,255,255,.7);border-radius:10px;padding:8px 6px;color:var(--accent);font-weight:800;font-size:12px;text-align:center;width:100%}
.dp-time:focus{outline:0;border-color:var(--accent2)}
.dp-text{flex:1;padding:10px 12px;background:#f5efea;border-radius:12px;font-size:13.5px;outline:0;cursor:text}
.dp-text:focus{box-shadow:0 0 0 2px rgba(127,185,185,.35)}
.dp-del{opacity:.5;transition:opacity .2s}
.dp-del:hover{opacity:1}
html.dark .dp-time{background:rgba(0,0,0,.3);color:#f2a9c9}
html.dark .dp-text{background:rgba(0,0,0,.3);color:var(--ink)}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
html.dark .chip.active{background:var(--accent);color:#1a1620;border-color:var(--accent)}
.card.rose .chip.active{background:var(--ink);color:#fff}

/* mini calendar (Planning) */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head b{font:600 15px var(--serif);text-transform:capitalize}
.cal-nav{border:1px solid var(--line);background:rgba(255,255,255,.6);width:30px;height:30px;border-radius:50%;font-size:15px;line-height:1;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.cal-nav:hover{background:#fff}
.mini-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.mini-cal .dow{font-size:10px;text-align:center;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-bottom:4px}
.mini-cal .day{all:unset;box-sizing:border-box;aspect-ratio:1;display:grid;place-items:center;border-radius:9px;font-size:12px;cursor:pointer;border:1.5px solid transparent;background:rgba(255,255,255,.55);position:relative;transition:background .15s,transform .15s;color:var(--ink)}
.mini-cal .day:hover{background:#fff;transform:scale(1.05)}
.mini-cal .day.today{border-color:var(--accent2)}
.mini-cal .day.selected{background:var(--ink);color:#fff}
.mini-cal .day.empty{visibility:hidden;cursor:default}
.mini-cal .day.empty:hover{background:transparent;transform:none}
.mini-cal .day .dot{position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.mini-cal .day.selected .dot{background:#fff}
html.dark .mini-cal .day{background:rgba(0,0,0,.28);color:var(--ink)}
html.dark .mini-cal .day.selected{background:var(--accent);color:#1a1620}
html.dark .mini-cal .day.selected .dot{background:#1a1620}
html.dark .cal-nav{background:rgba(0,0,0,.28);color:var(--ink);border-color:var(--line)}
.tabs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}
.tab{border:1px solid var(--line);background:rgba(255,255,255,.55);border-radius:999px;padding:8px 14px;font-size:13px;color:var(--muted);cursor:pointer}
.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.fab{position:fixed;right:24px;bottom:24px;width:54px;height:54px;border:0;border-radius:50%;background:var(--accent);color:#fff;font-size:26px;box-shadow:0 16px 34px rgba(156,85,76,.32);z-index:30}
.toast{position:fixed;left:50%;bottom:24px;z-index:40;background:var(--ink);color:#fff;padding:11px 16px;border-radius:999px;opacity:0;transform:translate(-50%,16px);transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(36,29,26,.35);backdrop-filter:blur(8px);z-index:50;display:none;place-items:center;padding:18px}
.modal.open{display:grid}
.sheet{width:min(580px,100%);max-height:84vh;overflow:auto;background:var(--paper);border-radius:28px;padding:24px;box-shadow:0 30px 80px rgba(36,29,26,.28)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet h2{font:600 28px var(--serif);margin:0}
.close{border:0;background:#eee5df;border-radius:50%;width:36px;height:36px;font-size:18px}
.mobile-brand,.menu{display:none}

/* readability: never faint-on-cream */
.head p{color:var(--ink)!important;opacity:.78}
.empty{color:var(--muted)!important}
.mini-tip{color:var(--ink)!important;opacity:.85}
.card:not(.hero):not(.tint):not(.sky):not(.rose):not(.lilac):not(.peach) .label{color:var(--muted)!important}
.field label{color:var(--muted)!important}
.side-foot{color:var(--muted)!important;opacity:.9}


.card[draggable=true]{cursor:grab}
.card[draggable=true]:active{cursor:grabbing}
.card.drag-ghost{opacity:.35;transform:scale(.98)}
.card.drag-over{outline:2px dashed var(--accent);outline-offset:3px}


.page{position:relative}
.orchid{pointer-events:none;z-index:0;opacity:.88;filter:drop-shadow(0 8px 20px rgba(212,99,161,.15))}
.orchid-br{position:absolute;right:8px;bottom:12px;width:min(150px,28vw)}
.orchid-tl{position:absolute;left:4px;top:8px;width:min(120px,22vw);opacity:.75}
.orchid-sm{width:56px;height:56px;opacity:.9;flex-shrink:0}
.page > .eyebrow,.page > .head,.page > .grid,.page > .grid2,.page > .mini-tip,.page > .tabs,.page > .btn{position:relative;z-index:1}
@media(max-width:900px){.orchid-br{width:100px;opacity:.7}.orchid-tl{width:80px;opacity:.55}}


/* progress: pink → white everywhere */
.progress i,.bar-fill{
  background:linear-gradient(90deg,#D463A1,#f7e4ec 70%,#fff)!important;
  box-shadow:0 0 10px rgba(212,99,161,.35)!important;
}
.goal-card .progress i{
  background:linear-gradient(90deg,#D463A1,#f7e4ec 70%,#fff)!important;
}
.card.tint .progress i,.card.sky .progress i{
  background:linear-gradient(90deg,#D463A1,#ffffff)!important;
}

/* lily botanical */
.lily-side{
  position:absolute;right:-18px;top:-20px;width:min(210px,48%);
  pointer-events:none;z-index:2;opacity:.95;
  filter:drop-shadow(0 12px 28px rgba(212,99,161,.2));
  transform:rotate(8deg);
  transition:transform .5s var(--ease);
}

  sb = (window.supabase && /^https?:\/\//.test(SUPABASE_URL))
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

  try{
    const {data,error} = await sb.from('profiles').select('data').eq('id',uid).maybeSingle();
    if(error){ console.warn('fetchProfile',error); return null; }
    return data ? data.data : null;
  }catch(e){ console.warn('fetchProfile',e); return null; }
}
async function upsertProfile(uid,state){
  try{
    const {error} = await sb.from('profiles').upsert({id:uid,data:state,updated_at:new Date().toISOString()});
    if(error) console.warn('upsertProfile',error);
  }catch(e){ console.warn('upsertProfile',e); }
}

function normalized(raw){
  const s={...clone(DEFAULT),...clone(raw||{})};
  s.ui={...DEFAULT.ui,...(raw?.ui||{})};
  if(!pages.some(x=>x[0]===s.ui.page)) s.ui.page='dashboard';
  s.money={...DEFAULT.money,...(raw?.money||{}),
    income:[...(raw?.money?.income||[])],
    expenses:[...(raw?.money?.expenses||[])],
    budgets:[...(raw?.money?.budgets||DEFAULT.money.budgets)],
    subscriptions:[...(raw?.money?.subscriptions||DEFAULT.money.subscriptions)]
  };
  for(const k of ['tasks','notes','projects','wishlist','gratitude','content','history','dayPlan','plans']){
    s[k]=Array.isArray(raw?.[k])?clone(raw[k]):clone(DEFAULT[k]);
  }
  // migrate old english default tag to a russian one used by the split ideas/planning boards
  s.notes.forEach(n=>{ if((n.tag||'').toLowerCase()==='idea') n.tag='идея'; });
  s.planner=(raw&&raw.planner&&typeof raw.planner==='object'&&!Array.isArray(raw.planner))?clone(raw.planner):{};
  s.mood=typeof raw?.mood==='string'?raw.mood:'';
  const g=Array.isArray(raw?.goals)?clone(raw.goals):clone(DEFAULT.goals);
  s.goals=g.length?g:clone(DEFAULT.goals);
  s.habits={...DEFAULT.habits,...(raw?.habits||{})};
  // migrate away from old default set if present
  const oldH=['Вода','Сон до 00:00'];
  if(oldH.some(k=>s.habits[k]!=null) && !s.habits['Витамины'] && !s.habits['Учеба/курсы']){
    const keep={};
    for(const [k,v] of Object.entries(s.habits)){
      if(k==='Чтение'||k==='Спорт') keep[k]=v;
      else if(!oldH.includes(k) && k!=='Вода') keep[k]=v;
    }
    s.habits={...DEFAULT.habits,...keep};
  }
  s.tarot={...DEFAULT.tarot,...(raw?.tarot||{}),clients:[...(raw?.tarot?.clients||[])],income:[...(raw?.tarot?.income||[])]};
  s.review={...DEFAULT.review,...(raw?.review||{})};
  return s;
}

class Store{
  constructor(initial){this.state=this.freeze(initial);this.past=[];this.future=[];this.listeners=new Set()}
  freeze(v){if(!v||typeof v!=='object')return v;if(Array.isArray(v))return Object.freeze(v.map(x=>this.freeze(x)));const o={};for(const k in v)o[k]=this.freeze(v[k]);return Object.freeze(o)}
  get(){return this.state}
  set(recipe,label='Изменение'){
    const draft=clone(this.state);recipe(draft);
    this.past.push(this.state);if(this.past.length>50)this.past.shift();
    this.future=[];
    draft.history=[...(draft.history||[]),{label,at:Date.now()}].slice(-25);
    this.state=this.freeze(draft);this.emit();
  }
  undo(){if(!this.past.length)return;this.future.push(this.state);this.state=this.past.pop();this.emit()}
  redo(){if(!this.future.length)return;this.past.push(this.state);this.state=this.future.pop();this.emit()}
  subscribe(fn){this.listeners.add(fn);return()=>this.listeners.delete(fn)}
  emit(){
    try{
      if(currentUser){
        saveLocalCache(currentUser.id, this.state);
        scheduleCloudSave(this.state);
        if(window.__flashSaved) window.__flashSaved();
      }
    }catch(e){console.warn('save failed',e)}
    this.listeners.forEach(fn=>fn(this.state));
  }
}

// ---- reusable compact month calendar (Planning + Tarot booking) ----
const RU_MONTHS=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
function todayISO(){const t=new Date();return `${t.getFullYear()}-${pad2(t.getMonth()+1)}-${pad2(t.getDate())}`}
function shiftMonth(monthKey,delta){
  const [Y,M]=monthKey.split('-').map(Number);
  const d=new Date(Y,(M-1)+delta,1);
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`;
}
function miniCalendarHTML(monthKey,selectedISO,marks){
  const [Y,M]=monthKey.split('-').map(Number);
  const first=new Date(Y,M-1,1);
  const daysInMonth=new Date(Y,M,0).getDate();
  const leading=(first.getDay()+6)%7;
  const cells=[];
  for(let i=0;i<leading;i++)cells.push(null);
  for(let d=1;d<=daysInMonth;d++)cells.push(d);
  while(cells.length%7!==0)cells.push(null);
  const title=RU_MONTHS[M-1].charAt(0).toUpperCase()+RU_MONTHS[M-1].slice(1)+' '+Y;
  const tISO=todayISO();
  return `
    <div class="cal-head">
      <button type="button" class="cal-nav" data-cal-prev>‹</button>
      <b>${title}</b>
      <button type="button" class="cal-nav" data-cal-next>›</button>
    </div>
    <div class="mini-cal">
      ${['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'].map(d=>`<div class="dow">${d}</div>`).join('')}
      ${cells.map(d=>{
        if(!d)return `<span class="day empty"></span>`;
        const iso=`${Y}-${pad2(M)}-${pad2(d)}`;
        const cls=['day'];
        if(iso===tISO)cls.push('today');
        if(iso===selectedISO)cls.push('selected');
        const has=marks&&marks.has(iso);
        return `<button type="button" class="${cls.join(' ')}" data-cal-day="${iso}">${d}${has?'<span class="dot"></span>':''}</button>`;
      }).join('')}
    </div>`;
}
function bindMiniCalendar(root,{onPrev,onNext,onSelect}){
  const prev=root.querySelector('[data-cal-prev]');if(prev)prev.onclick=onPrev;
  const next=root.querySelector('[data-cal-next]');if(next)next.onclick=onNext;
  root.querySelectorAll('[data-cal-day]').forEach(b=>b.onclick=()=>onSelect(b.dataset.calDay));
}


function bindDragReorder(root, selector, getList, setList, label){
  const cards=[...root.querySelectorAll(selector)];
  cards.forEach((el,idx)=>{
    el.setAttribute('draggable','true');
    el.addEventListener('dragstart',e=>{
      e.dataTransfer.setData('text/plain', String(idx));
      e.dataTransfer.effectAllowed='move';
      el.classList.add('drag-ghost');
    });
    el.addEventListener('dragend',()=>el.classList.remove('drag-ghost'));
    el.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';el.classList.add('drag-over')});
    el.addEventListener('dragleave',()=>el.classList.remove('drag-over'));
    el.addEventListener('drop',e=>{
      e.preventDefault();el.classList.remove('drag-over');
      const from=+e.dataTransfer.getData('text/plain');
      const to=idx;
      if(from===to||Number.isNaN(from))return;
      store.set(s=>{
        const list=getList(s);
        if(!list||from>=list.length||to>=list.length)return;
        const [item]=list.splice(from,1);
        list.splice(to,0,item);
        setList(s,list);
      },label||'Порядок');
    });
  });
}

}

        <div class="grid" id="goalsGrid">
          ${goals.map((g,i)=>`
            <article class="card goal-card ${g.progress>60?'tint':''}" data-card="цель" data-gidx="${i}">
              <div class="goal-num">${String(i+1).padStart(2,'0')}</div>
              <div class="label">Цель ${i+1}</div>
              <div class="field"><input data-g="${g.id}" data-f="title" placeholder="Название цели" value="${esc(g.title)}"></div>
              <div class="field"><textarea data-g="${g.id}" data-f="text" placeholder="Что именно? Зачем? Как пойму, что получилось?">${esc(g.text)}</textarea></div>
              <div class="field"><label>Прогресс — ${g.progress||0}%</label>
                <input type="range" min="0" max="100" value="${g.progress||0}" data-g="${g.id}" data-f="progress">
              </div>
              <div class="progress"><i style="width:${g.progress||0}%"></i></div>
              <div class="chips" style="margin-top:8px">
                <button class="chip" type="button" data-delgoal="${g.id}">Удалить</button>
              </div>
            </article>
          `).join('')}
          <article class="card" data-card="новая">
            <div class="label">Новая цель</div>
            <button class="btn primary" id="addGoal" type="button">+ Добавить цель</button>
          </article>
        </div>
      </div>`;
    $$('[data-g]',this.root).forEach(el=>{
      const ev=el.type==='range'?'input':'change';
      this.listen(el,ev,()=>{
        store.set(s=>{
          const g=s.goals.find(x=>x.id==el.dataset.g);
          if(!g)return;
          if(el.dataset.f==='progress') g.progress=+el.value;
          else g[el.dataset.f]=el.value;
        },'Цель');
      });
    });
    $$('[data-delgoal]',this.root).forEach(b=>this.listen(b,'click',()=>{
      if(!confirm('Удалить эту цель?'))return;
      store.set(s=>{s.goals=s.goals.filter(x=>x.id!=b.dataset.delgoal)},'Цель удалена');
    }));
    this.listen($('#addGoal'),'click',()=>store.set(s=>{
      s.goals.push({id:Date.now(),title:'',text:'',progress:0});
    },'Новая цель'));
    bindDragReorder(this.root, '#goalsGrid .goal-card', s=>s.goals, (s,l)=>{s.goals=l}, 'Порядок целей');
  }
}

class Planner extends Component{
  render(){
    const s=store.get();
    const tISO=todayISO();
    const monthKey=s.ui.plannerMonth||tISO.slice(0,7);
    const selDate=s.ui.plannerDate||tISO;
    const planner=s.planner||{};
    const plans=s.plans||[];
    const marks=new Set(Object.keys(planner).filter(k=>(planner[k]||[]).length));
    const dayItems=planner[selDate]||[];
    const doneN=dayItems.filter(x=>x.done).length;
    const selLabel=new Date(selDate+'T00:00:00').toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
    this.root.innerHTML=`
      <div class="page"><svg class="orchid orchid-br" viewBox="0 0 160 180" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="o1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffe4f0"/><stop offset="100%" stop-color="#e889b0"/></linearGradient><linearGradient id="o2" x1="0" y1="1" x2="1" y2="0"><stop offset="0%" stop-color="#fff0f6"/><stop offset="100%" stop-color="#d463a1"/></linearGradient></defs><path d="M120 175 C115 140 100 110 85 85" fill="none" stroke="#6b8f71" stroke-width="1.8" stroke-linecap="round"/><g transform="translate(78,70) rotate(-10)"><ellipse cx="-14" cy="4" rx="11" ry="18" transform="rotate(-50)" fill="url(#o1)"/><ellipse cx="14" cy="4" rx="11" ry="18" transform="rotate(50)" fill="url(#o1)"/><ellipse cx="-10" cy="-12" rx="9" ry="14" transform="rotate(-20)" fill="url(#o2)"/><ellipse cx="10" cy="-12" rx="9" ry="14" transform="rotate(20)" fill="url(#o2)"/><ellipse cx="0" cy="12" rx="7" ry="12" fill="#e889b0"/><circle cx="0" cy="0" r="4.5" fill="#c4457a"/></g><g transform="translate(105,95) rotate(20) scale(.7)"><ellipse cx="-12" cy="3" rx="9" ry="15" transform="rotate(-50)" fill="url(#o2)"/><ellipse cx="12" cy="3" rx="9" ry="15" transform="rotate(50)" fill="url(#o1)"/><ellipse cx="0" cy="10" rx="6" ry="10" fill="#e889b0"/><circle cx="0" cy="0" r="3.5" fill="#c4457a"/></g><ellipse cx="125" cy="60" rx="5" ry="9" transform="rotate(30 125 60)" fill="#f5b8d0"/></svg>
        <div class="eyebrow">Дни и шаги</div>
        <div class="head">
          <h1>Моё <em>планирование.</em></h1>
          <p>Выбери день в календаре и распиши, что в нём важно.</p>
        </div>
        <div class="grid2">
          ${card('Календарь',miniCalendarHTML(monthKey,selDate,marks),'sky')}
          ${card('День',`
            <h3 style="text-transform:capitalize;margin:0 0 4px;font-size:16px">${selLabel}</h3>
            <p class="empty" style="margin:0 0 10px">${dayItems.length?`${doneN} из ${dayItems.length} готово`:'Пока пусто'}</p>
            <div>${dayItems.map(it=>`
              <label class="check"><input type="checkbox" data-pid="${it.id}" ${it.done?'checked':''}><i class="box"></i><span style="${it.done?'text-decoration:line-through;opacity:.55':''}">${esc(it.text)}</span>
                <button type="button" class="row-del" data-delpid="${it.id}" title="Удалить">✕</button>
              </label>`).join('') || '<p class="empty">Нажми на день слева и добавь первый пункт.</p>'}
            </div>
            <form class="task-form" id="plannerForm"><input id="plannerInput" placeholder="Добавить на этот день"><button type="submit">+</button></form>
          `,'peach')}
        </div>
        <div class="head" style="margin:28px 0 14px">
          <h1 style="font:600 clamp(24px,3.6vw,36px)/1 var(--serif);letter-spacing:-1.5px">Мои <em style="color:var(--accent);font-weight:400">планы.</em></h1>
          <p>Отдельные дашборды под каждый план: свои шаги, отметки и удаление. Всё сохраняется автоматически.</p>
        </div>
        <div class="grid" id="plansGrid">
          ${plans.map(p=>{
            const items=p.items||[];
            const doneCnt=items.filter(i=>i.done).length;
            const ppct=items.length?Math.round(doneCnt/items.length*100):0;
            return card(items.length?ppct+'% готово':'план',`
              <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
                <h2 style="margin:0 0 8px">${esc(p.title||'Без названия')}</h2>
                <button type="button" class="row-del" data-delplan="${p.id}" title="Удалить план">✕</button>
              </div>
              <div class="bar-track"><div class="bar-fill" style="width:${ppct}%"></div></div>
              <div style="margin-top:10px">${items.map(it=>`
                <label class="check"><input type="checkbox" data-planitem="${p.id}:${it.id}" ${it.done?'checked':''}><i class="box"></i><span style="${it.done?'text-decoration:line-through;opacity:.55':''}">${esc(it.text)}</span>
                  <button type="button" class="row-del" data-delitem="${p.id}:${it.id}" title="Удалить">✕</button>
                </label>`).join('') || '<p class="empty">Пока нет шагов — добавь первый.</p>'}
              </div>
              <form class="task-form" data-addform="${p.id}"><input placeholder="Новый шаг" required><button type="submit">+</button></form>
            `,'tint');
          }).join('')}
          ${card('Новый план',`
            <form id="newPlanForm">
              <div class="field"><input name="title" placeholder="Название плана" required></div>
              <button class="btn primary">Создать план</button>
            </form>
          `,'rose')}
        </div>
      </div>`;
    bindMiniCalendar(this.root,{
      onPrev:()=>store.set(s2=>{s2.ui.plannerMonth=shiftMonth(monthKey,-1)},'Месяц'),
      onNext:()=>store.set(s2=>{s2.ui.plannerMonth=shiftMonth(monthKey,1)},'Месяц'),
      onSelect:iso=>store.set(s2=>{s2.ui.plannerDate=iso},'День')
    });
    $$('[data-pid]',this.root).forEach(el=>this.listen(el,'change',()=>store.set(s2=>{
      const it=(s2.planner[selDate]||[]).find(x=>x.id==el.dataset.pid);if(it)it.done=el.checked;
    },'Задача дня')));
    $$('[data-delpid]',this.root).forEach(el=>this.listen(el,'click',()=>store.set(s2=>{
      s2.planner[selDate]=(s2.planner[selDate]||[]).filter(x=>x.id!=el.dataset.delpid);
    },'Удаление')));
    this.listen($('#plannerForm'),'submit',e=>{
      e.preventDefault();
      const i=$('#plannerInput',this.root);
      if(!i.value.trim())return;
      store.set(s2=>{
        s2.planner=s2.planner||{};
        (s2.planner[selDate]=s2.planner[selDate]||[]).push({id:Date.now(),text:i.value.trim(),done:false});
      },'План дня');
    });
    // --- Мои планы (дашборды) ---
    $$('[data-planitem]',this.root).forEach(el=>this.listen(el,'change',()=>{
      const [pid,iid]=el.dataset.planitem.split(':');
      store.set(s2=>{
        const plan=(s2.plans||[]).find(p=>String(p.id)===pid);
        const it=plan&&(plan.items||[]).find(x=>String(x.id)===iid);
        if(it)it.done=el.checked;
      },'Шаг плана');
    }));
    $$('[data-delitem]',this.root).forEach(el=>this.listen(el,'click',()=>{
      const [pid,iid]=el.dataset.delitem.split(':');
      store.set(s2=>{
        const plan=(s2.plans||[]).find(p=>String(p.id)===pid);
        if(plan)plan.items=(plan.items||[]).filter(x=>String(x.id)!==iid);
      },'Шаг удалён');
    }));
    $$('[data-addform]',this.root).forEach(f=>this.listen(f,'submit',e=>{
      e.preventDefault();
      const pid=f.dataset.addform;
      const input=f.querySelector('input');
      const text=(input.value||'').trim();
      if(!text)return;
      store.set(s2=>{
        const plan=(s2.plans||[]).find(p=>String(p.id)===pid);
        if(plan)(plan.items=plan.items||[]).push({id:Date.now(),text,done:false});
      },'Новый шаг плана');
    }));
    $$('[data-delplan]',this.root).forEach(el=>this.listen(el,'click',()=>{
      if(!confirm('Удалить этот план целиком?'))return;
      store.set(s2=>{ s2.plans=(s2.plans||[]).filter(p=>String(p.id)!==el.dataset.delplan); },'План удалён');
    }));
    this.listen($('#newPlanForm'),'submit',e=>{
      e.preventDefault();
      const f=new FormData(e.target);
      const title=(f.get('title')||'').trim();
      if(!title)return;
      store.set(s2=>{ (s2.plans=s2.plans||[]).push({id:Date.now(),title,items:[]}); },'Новый план');
    });
  }
}

class Habits extends Component{

        <div class="eyebrow">Не контроль, а ритуал</div>
        <div class="head"><h1>Мои <em>ритуалы.</em></h1><p>Маленькие повторения, из которых складывается устойчивость. Можно добавлять, переименовывать и удалять.</p></div>
        <div class="mini-tip" id="habitTip" style="margin-bottom:16px"><span class="pulse-dot"></span>Не гонись за 7/7. 4–5 дней из семи уже меняют месяц.</div>
        <div class="grid">
          ${(()=>{const vals=Object.values(s.habits||{});const avg=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/(vals.length*7)*100):0;return card('Неделя',`<div class="ring-mini" style="--p:${avg}"><span>${avg}%</span></div><div class="bar-track"><div class="bar-fill" style="width:${avg}%"></div></div><p class="empty">${vals.length} ритуалов</p>`,'sky')})()}
          ${card('Новый ритуал',`
            <form id="habitForm">
              <div class="field"><input name="name" placeholder="Название (например: Растяжка)" required maxlength="40"></div>
              <button class="btn primary">Добавить</button>
            </form>
          `,'rose')}
          ${entries.map(([n,v])=>card(n,`
            <h2>${v} из 7</h2>
            <div class="progress"><i style="width:${Math.min(100,v/7*100)}%"></i></div>
            <div class="chips">${Array.from({length:7},(_,i)=>`<button class="chip" type="button" data-habit="${esc(n)}" data-v="${i+1}" style="${i<v?'background:var(--ink);color:#fff;border-color:var(--ink)':''}">${i+1}</button>`).join('')}</div>
            <div class="habit-actions">
              <button class="chip" type="button" data-rename="${esc(n)}">Переименовать</button>
              <button class="chip" type="button" data-delh="${esc(n)}">Удалить</button>
            </div>
          `,'tint')).join('') || card('Пока пусто','<p class="empty">Добавь первый ритуал слева.</p>')}
        </div>
      </div>`;
    this.listen($('#habitForm'),'submit',e=>{
      e.preventDefault();
      const name=new FormData(e.target).get('name').trim();
      if(!name)return;
      store.set(s=>{
        if(s.habits[name]!=null){toast('Такой уже есть');return;}
        s.habits[name]=0;
      },'Новый ритуал');
    });
    $$('[data-habit]',this.root).forEach(b=>this.listen(b,'click',()=>store.set(s=>{
      s.habits[b.dataset.habit]=+b.dataset.v;
    },'Ритуал')));
    $$('[data-delh]',this.root).forEach(b=>this.listen(b,'click',()=>{
      if(!confirm('Удалить ритуал «'+b.dataset.delh+'»?'))return;
      store.set(s=>{delete s.habits[b.dataset.delh]},'Ритуал удалён');
    }));
    $$('[data-rename]',this.root).forEach(b=>this.listen(b,'click',()=>{
      const old=b.dataset.rename;
      const neu=prompt('Новое название',old);
      if(!neu||!neu.trim()||neu.trim()===old)return;
      const name=neu.trim();
      store.set(s=>{
        if(s.habits[name]!=null){toast('Такое имя уже есть');return;}
        const val=s.habits[old];
        delete s.habits[old];
        s.habits[name]=val;
      },'Ритуал переименован');
    }));
  }
}

      const title=prompt('Новый заголовок',item.title);
      if(title==null||!title.trim())return;
      const text=prompt('Текст / описание',item.text||'');

      store.set(s=>{

        if(x){x.title=title.trim();x.text=text.trim()}
      },'Контент обновлён');
    }));
  }
}

          `,'peach')}

            <p style="margin:0 0 10px;font-size:14px">${tr('Сейчас:','Signed in:')} <b>${esc(name||'—')}</b></p>
            <div class="field"><label>${tr('Имя в приветствии','Greeting name')}</label>
              <input id="setName" value="${esc(name)}" maxlength="40"></div>
            <button class="btn primary" id="saveName" type="button">${tr('Сохранить имя','Save name')}</button>
            <button class="btn" id="logout" type="button" style="margin-left:8px">${tr('Выйти','Log out')}</button>
          `,'rose')}
          ${card(t('lang')||'Язык',`
            <div class="chips">
              <button class="chip${lang==='ru'?' active':''}" type="button" data-lang="ru">${t('langRu')}</button>
              <button class="chip${lang==='en'?' active':''}" type="button" data-lang="en">${t('langEn')}</button>
            </div>
          `)}
          ${card(t('accent')||'Акцент',`
            <div class="chips">${['#D463A1','#F0CAA1','#7FB9B9','#6CAEDE','#554345'].map(c=>`<button class="chip" data-color="${c}" style="background:${c};width:32px;height:32px;padding:0;border-radius:50%"></button>`).join('')}</div>
          `)}
          ${card(tr('Автосохранение','Autosave'),`
            <p style="margin:0 0 10px;line-height:1.55;font-size:14px">${tr('Каждое изменение сохраняется в облако (Supabase) и кэшируется в этом браузере для мгновенной загрузки. Зайди под тем же email на другом устройстве — данные будут те же.','Every change is saved to the cloud (Supabase) and cached in this browser for instant loading. Sign in with the same email on another device — your data will be the same.')}</p>
            <p style="margin:0 0 10px;line-height:1.55;font-size:14px;color:var(--muted)">${tr('Для дополнительной надёжности можно скачать JSON-бэкап.','You can still download a JSON backup for extra safety.')}</p>
            <button class="btn primary" id="export" type="button">${t('exportBtn')||'Скачать JSON'}</button>
            <button class="btn" id="reset" type="button" style="margin-left:8px">${tr('Сбросить профиль','Reset profile')}</button>
          `,'sky')}
        </div>
      </div>`;
    this.listen($('#saveName'),'click',()=>{
      const v=($('#setName').value||'').trim()||name;
      store.set(s=>{s.ui.name=v},'Имя');
      toast(tr('Сохранено','Saved'));
    });
    this.listen($('#logout'),'click',async()=>{
      try{ if(cloudReady()) await sb.auth.signOut(); }catch(e){}
      currentUser=null;
      location.reload();
    });
    $$('[data-color]',this.root).forEach(b=>this.listen(b,'click',()=>store.set(s=>s.ui.accent=b.dataset.color,'Цвет')));
    $$('[data-lang]',this.root).forEach(b=>this.listen(b,'click',()=>store.set(s=>s.ui.lang=b.dataset.lang,'Language')));
    this.listen($('#export'),'click',()=>{
      const a=document.createElement('a');
      a.href=URL.createObjectURL(new Blob([JSON.stringify(store.get(),null,2)],{type:'application/json'}));
      a.download='shikand-backup.json'; a.click();
      toast(tr('Бэкап скачан','Backup downloaded'));
    });
    this.listen($('#reset'),'click',()=>{
      if(!confirm(tr('Сбросить данные этого профиля?','Reset this profile?')))return;
      const fresh=normalized(emptyProfile(name));
      store.state=store.freeze(fresh); store.past=[]; store.future=[];
      store.emit();
      appRender();
      toast(tr('Профиль сброшен','Profile reset'));
    });
  }
}


const map={
  dashboard:Today,
  goals:Goals,
  career:Career,
  money:Money,
  habits:Habits,
  wishlist:Wishlist,
  content:Content,
  tarot:Tarot,
  gratitude:Gratitude,
  review:Review,
  settings:Settings
};


function showAuth(err){
  const g=$('#authGate'); if(!g) return;
  g.classList.remove('hidden');
  $('#authErr').textContent=err||'';
  document.body.style.overflow='hidden';
}
function hideAuth(){
  const g=$('#authGate'); if(!g) return;
  g.classList.add('hidden');
  document.body.style.overflow='';
}
window.__flashSaved=function(){
  const p=$('#savePill'); if(!p) return;
  p.textContent=tr('Сохранено','Saved');
  p.classList.add('show');
  clearTimeout(window.__saveT);
  window.__saveT=setTimeout(()=>p.classList.remove('show'),1200);
};
function credsKey(name,pin){
  const raw=String(name||'').trim().toLowerCase()+'|'+String(pin||'');
  let h=5381;
  for(let i=0;i<raw.length;i++) h=((h<<5)+h)^raw.charCodeAt(i);
  return (h>>>0).toString(36);
}
function credsToAuth(name,pin){
  const key=credsKey(name,pin);
  return { email: 'u'+key+'@shikand.app', password: pin+'-sk-'+key };
}
async function enterWithUser(user, nameForNewProfile){
  try{
    currentUser={id:user.id, email:user.email};
    let remote=null;
    if(cloudReady()){
      try{ remote=await fetchProfile(user.id); }catch(e){ console.warn(e); }
    }
    let raw = remote || loadLocalCache(user.id) || emptyProfile(nameForNewProfile || 'друг');
    const st = normalized(raw);
    store.state=store.freeze(st);
    store.past=[]; store.future=[];
    saveLocalCache(user.id, store.state);
    if(cloudReady() && !remote) scheduleCloudSave(store.state);
    hideAuth();
    appRender();
  }catch(e){
    console.error('enterWithUser failed', e);
    currentUser=null;
    showAuth('Не удалось загрузить твои данные. Обнови страницу и попробуй войти снова.');
  }
}
async function doSignIn(){
  const name=($('#authName').value||'').trim();
  const pin=String($('#authPin').value||'');
  if(!name){ showAuth('Введи имя'); return; }
  if(pin.length!==4){ showAuth('Пароль — ровно 4 символа'); return; }
  if(!cloudReady()){ showAuth('Облако не настроено: впиши SUPABASE_URL и SUPABASE_ANON_KEY в коде.'); return; }
  showAuth('Входим…');
  const {email,password}=credsToAuth(name,pin);
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  if(error){ showAuth(error.message==='Invalid login credentials'?'Профиль не найден или неверный пароль. Нажми «Создать аккаунт», если это первый раз.':error.message); return; }
  await enterWithUser(data.user, name);
  toast('С возвращением, '+name);
}
async function doSignUp(){
  const name=($('#authName').value||'').trim();
  const pin=String($('#authPin').value||'');
  if(!name){ showAuth('Введи имя'); return; }
  if(pin.length!==4){ showAuth('Пароль — ровно 4 символа'); return; }
  if(!cloudReady()){ showAuth('Облако не настроено: впиши SUPABASE_URL и SUPABASE_ANON_KEY в коде.'); return; }
  showAuth('Создаём аккаунт…');
  const {email,password}=credsToAuth(name,pin);
  const {data,error}=await sb.auth.signUp({email,password});
  if(error){
    showAuth(/registered/i.test(error.message)?'Такое имя и пароль уже заняты. Попробуй войти или выбери другой пароль.':error.message);
    return;
  }
  if(!data.session){
    showAuth('Аккаунт создан, но вход не подтверждён. Проверь настройки почты в Supabase (Confirm email должен быть выключен) и попробуй «Войти».');
    return;
  }
  await enterWithUser(data.user, name);
  toast('Пространство создано · автосохранение в облаке включено');
}
async function bindAuth(){
  $('#authEnter')?.addEventListener('click', doSignIn);
  $('#authCreate')?.addEventListener('click', doSignUp);
  $('#authPin')?.addEventListener('keydown', e=>{ if(e.key==='Enter') doSignIn(); });
  $('#authName')?.addEventListener('keydown', e=>{ if(e.key==='Enter') $('#authPin')?.focus(); });
  showAuth();
  if(cloudReady()){
    try{
      const {data}=await sb.auth.getSession();
      if(data?.session?.user){ await enterWithUser(data.session.user); }
    }catch(e){ console.warn(e); }
  }
}

let pageComp=null;
const navComp=new Nav($('#nav')).mount();


function applyTheme(t){
  document.documentElement.classList.toggle('dark', t==='dark');
  const btn=$('#themeBtn');
  if(btn) btn.textContent = t==='dark' ? '☀' : '☾';
}

function appRender(){
  try{
    const s=store.get();
    document.documentElement.style.setProperty('--accent',s.ui.accent);
    applyTheme(s.ui.theme||'light');
    const sf=$('#sideFoot'); if(sf) sf.textContent=t('dataLocal');
    document.documentElement.lang=s.ui.lang||'ru';
    navComp.render();
    pageComp?.destroy();
    const page=s.ui.page;
    if(page==='planning') pageComp=new Planner($('#view')).mount();
    else if(page==='ideas') pageComp=new Board($('#view')).mount();
    else{ const Page=map[page]||Today; pageComp=new Page($('#view')).mount(); }
  }catch(e){
    console.error('appRender failed', e);
    const v=$('#view');
    if(v) v.innerHTML='<div style="padding:30px"><h2>Что-то пошло не так при отрисовке</h2><p style="color:var(--muted)">Обнови страницу. Если не поможет — напиши, что показывает консоль (F12 → Console).</p></div>';
  }
}
store.subscribe(appRender);
try{
  bindAuth();
}catch(e){
  console.warn('bindAuth failed', e);
  showAuth('Не удалось подключиться к облаку. Проверь интернет и обнови страницу.');
}
function flushSaveNow(){
  try{
    if(currentUser){
      saveLocalCache(currentUser.id, store.get());
      if(cloudReady()){ clearTimeout(cloudSaveTimer); upsertProfile(currentUser.id, store.get()); }
    }
  }catch(e){}
}
window.addEventListener('beforeunload', flushSaveNow);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') flushSaveNow(); });

function openNote(note,defaultTag){
  $('#modalTitle').textContent=note?'Редактировать':'Новая карточка';
  $('#modalBody').innerHTML=`
    <div class="field"><label>Заголовок</label><input id="nt" value="${esc(note?.title||'')}"></div>
    <div class="field"><label>Текст</label><textarea id="nx">${esc(note?.text||'')}</textarea></div>
    <div class="field"><label>Тег</label><input id="ng" value="${esc(note?.tag||defaultTag||'идея')}"></div>
    <button class="btn primary" id="ns">Сохранить</button>`;
  $('#modal').classList.add('open');
  $('#ns').onclick=()=>{
    const data={title:$('#nt').value||'Без названия',text:$('#nx').value,tag:$('#ng').value||'идея'};
    store.set(s=>{
      if(note) Object.assign(s.notes.find(n=>n.id===note.id),data);
      else s.notes.unshift({id:Date.now(),important:false,...data});
    },'Карточка');
    $('#modal').classList.remove('open');
    toast('Сохранено');
  };
}

$('#fab').onclick=()=>{
  const page=store.get().ui.page;
  if(page==='wishlist'){/* form already on page */}
  else if(page==='content'){/* form on page */}
  else if(page==='planning'){/* has its own inline day-form */}
  else if(page==='ideas') openNote(null,'идея');
  else openNote();
};
$('#close').onclick=()=>$('#modal').classList.remove('open');
$('#modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('open')};
$('#themeBtn').onclick=()=>store.set(s=>{s.ui.theme=(s.ui.theme==='dark'?'light':'dark')},'Тема');
$('#undo').onclick=()=>store.undo();
$('#redo').onclick=()=>store.redo();
$('#menu').onclick=()=>$('#side').classList.toggle('open');

</script>
